services:
  postgres:
    image: postgres:16-alpine
    container_name: cancer-detection-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_admin_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform_admin} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cancer-detection-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: cancer-detection-minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
    container_name: cancer-detection-ai
    environment:
      AI_MODEL_PATH: ${AI_MODEL_PATH:-/app/models/cxr_multitask.onnx}
      AI_MODEL_VERSION: ${AI_MODEL_VERSION:-cxr-multitask-v1}
      AI_INPUT_SIZE: ${AI_INPUT_SIZE:-224}
      AI_CALIBRATION_TEMPERATURE: ${AI_CALIBRATION_TEMPERATURE:-1.6}
      AI_THRESHOLD_HIGH_SENS: ${AI_THRESHOLD_HIGH_SENS:-0.55}
      AI_THRESHOLD_HIGH_SPEC: ${AI_THRESHOLD_HIGH_SPEC:-0.70}
      AI_CLINICAL_CONFIG_PATH: ${AI_CLINICAL_CONFIG_PATH:-/app/models/clinical_config.json}
      AI_CLINICAL_GOVERNANCE_PATH: ${AI_CLINICAL_GOVERNANCE_PATH:-/app/models/clinical_governance.json}
      AI_ENFORCE_GOVERNANCE_GATE: ${AI_ENFORCE_GOVERNANCE_GATE:-true}
      AI_GOV_MIN_SITE_COUNT: ${AI_GOV_MIN_SITE_COUNT:-2}
      AI_GOV_MIN_AUROC: ${AI_GOV_MIN_AUROC:-0.90}
      AI_GOV_MIN_SENSITIVITY: ${AI_GOV_MIN_SENSITIVITY:-0.90}
      AI_GOV_MIN_SPECIFICITY: ${AI_GOV_MIN_SPECIFICITY:-0.85}
      AI_DETECTOR_MODEL_PATH: ${AI_DETECTOR_MODEL_PATH:-/app/models/cxr_detector.onnx}
      AI_DETECTOR_PROFILE_PATH: ${AI_DETECTOR_PROFILE_PATH:-/app/models/detector_profile.json}
      AI_DETECTOR_SHA256: ${AI_DETECTOR_SHA256:-}
      AI_DETECTOR_INPUT_SIZE: ${AI_DETECTOR_INPUT_SIZE:-224}
      AI_DETECTOR_CONF_THRESHOLD: ${AI_DETECTOR_CONF_THRESHOLD:-0.25}
      AI_DETECTOR_IOU_THRESHOLD: ${AI_DETECTOR_IOU_THRESHOLD:-0.45}
      AI_ENFORCE_DETECTOR_STARTUP_CHECK: ${AI_ENFORCE_DETECTOR_STARTUP_CHECK:-true}
      AI_ENABLE_HEURISTIC_REGIONS: ${AI_ENABLE_HEURISTIC_REGIONS:-false}
      AI_ENABLE_TTA: ${AI_ENABLE_TTA:-true}
      AI_ENABLE_FP_REDUCTION: ${AI_ENABLE_FP_REDUCTION:-true}
      AI_FP_MIN_LUNG_OVERLAP: ${AI_FP_MIN_LUNG_OVERLAP:-0.20}
      AI_ORT_PREFER_CUDA: ${AI_ORT_PREFER_CUDA:-true}
      AI_ORT_ENABLE_IO_BINDING: ${AI_ORT_ENABLE_IO_BINDING:-true}
      AI_ORT_CUDA_DEVICE_ID: ${AI_ORT_CUDA_DEVICE_ID:-0}
      AI_ORT_INTRA_OP_THREADS: ${AI_ORT_INTRA_OP_THREADS:-1}
      AI_ORT_INTER_OP_THREADS: ${AI_ORT_INTER_OP_THREADS:-1}
      AI_ORT_GRAPH_OPT_LEVEL: ${AI_ORT_GRAPH_OPT_LEVEL:-all}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./ai-service/models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-go:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: cancer-detection-backend-go
    environment:
      PORT: 8080
      GATEWAY_DATABASE_URL: ${GATEWAY_DATABASE_URL:-postgresql://gateway_app:gateway_app_change_me@postgres:5432/gateway_db}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET:-change-me-in-production}
      MICROSERVICE_MODE: ${MICROSERVICE_MODE:-strict}
      DETECTION_SERVICE_URL: ${DETECTION_SERVICE_URL:-http://detection-service:8081}
      REPORT_SERVICE_URL: ${REPORT_SERVICE_URL:-http://report-service:8082}
      GOVERNANCE_SERVICE_URL: ${GOVERNANCE_SERVICE_URL:-http://governance-service:8083}
      CACHE_BACKEND: ${CACHE_BACKEND:-redis}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      UPLOAD_DIR: /app/public/uploads
      UPLOAD_PUBLIC_PREFIX: /uploads
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      detection-service:
        condition: service_started
      report-service:
        condition: service_started
      governance-service:
        condition: service_started

  detection-service:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: cancer-detection-detection-service
    command: ["/app/detection-service"]
    environment:
      PORT: 8081
      GRPC_PORT: 9081
      DETECTION_DATABASE_URL: ${DETECTION_DATABASE_URL:-postgresql://detection_app:detection_app_change_me@postgres:5432/detection_db}
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy

  report-service:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: cancer-detection-report-service
    command: ["/app/report-service"]
    environment:
      PORT: 8082
      GRPC_PORT: 9082
      REPORT_DATABASE_URL: ${REPORT_DATABASE_URL:-postgresql://report_app:report_app_change_me@postgres:5432/report_db}
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy

  governance-service:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: cancer-detection-governance-service
    command: ["/app/governance-service"]
    environment:
      PORT: 8083
      GRPC_PORT: 9083
      GOVERNANCE_DATABASE_URL: ${GOVERNANCE_DATABASE_URL:-postgresql://governance_app:governance_app_change_me@postgres:5432/governance_db}
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET:-change-me-in-production}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
